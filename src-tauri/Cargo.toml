[package]
name = "skills-manger"
version = "0.1.0"
description = "Local-first Skills Control Center"
authors = ["1264585648"]
edition = "2021"

[lib]
name = "skills_manger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"

# Scanning is CPU bound (directory walks plus SHA-256 over every skill file).
# A fully unoptimized debug binary made the first scan feel frozen, so the
# dependencies that do the real work (rusqlite, sha2, serde) are optimized even
# in dev builds while this crate stays fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
