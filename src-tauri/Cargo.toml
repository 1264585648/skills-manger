[package]
name = "skills-manger"
version = "0.1.0"
description = "Local-first Skills Control Center"
authors = ["1264585648"]
edition = "2021"

[lib]
name = "skills_manger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
thiserror = "2"
